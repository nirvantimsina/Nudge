version: '3.8'

services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-database
    ports:
      - "5444:5432" # Direct host access for GUI tools if needed
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nudge
    volumes:
      - nudge_postgres_data:/var/lib/postgresql/data
      - ./Nudge.DB:/docker-entrypoint-initdb.d
    networks:
      - nudge-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nudge-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:5432" # Host access to PgBouncer
    environment:
      # Target Database Details
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: nudge

      # Pooling Configuration
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: postgres

      # Critical parameter for Npgsql / ADO.NET
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - nudge-network
    depends_on:
      - postgres-db

  seq-analytics:
    image: datalust/seq:latest
    container_name: nudge-seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - nudge_seq_store:/data
    networks:
      - nudge-network
    depends_on:
      - postgres-db

  nudge-api:
    build:
      context: .
      dockerfile: Nudge.Presentation/Dockerfile
    container_name: nudge-backend-api
    ports:
      - "5043:5043"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Connected through pgbouncer on internal port 5432 with Npgsql flags
      - ConnectionStrings__Nudge_DB=Host=pgbouncer;Port=5432;Database=nudge;Username=postgres;Password=password;Max Auto Prepare=0;No Reset On Close=true;
      - Serilog__WriteTo__1__Args__serverUrl=http://seq-analytics:80
    volumes:
      - .:/src
      - /src/Nudge.Presentation/bin
      - /src/Nudge.Presentation/obj
      - /src/Nudge.Application/bin
      - /src/Nudge.Application/obj
      - /src/Nudge.Infrastructure/bin
      - /src/Nudge.Infrastructure/obj
      - /src/Nudge.Domain/bin
      - /src/Nudge.Domain/obj
      - /src/Nudge.Shared/bin
      - /src/Nudge.Shared/obj
    networks:
      - nudge-network
    depends_on:
      - pgbouncer
      - seq-analytics

  nudge-ui:
    build:
      context: ./Nudge.UI
      dockerfile: Dockerfile
    container_name: nudge-frontend-ui
    ports:
      - "3000:3000"
    volumes:
      - ./Nudge.UI:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5043/api   # used by browser
      - INTERNAL_API_URL=http://nudge-api:5043/api      # used by server components
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - ZITADEL_ISSUER=http://localhost:8080
      - ZITADEL_CLIENT_ID=392645870304100356
      - NEXT_PUBLIC_ENABLE_SSO=false
    networks:
      - nudge-network
    depends_on:
      - nudge-api

  nudge-zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: nudge-zitadel
    command: 'start-from-init --masterkey "MasterKeyNeedsToBe32CharactersLong!" --tlsMode disabled'
    environment:
      - ZITADEL_DATABASE_POSTGRES_HOST=postgres-db
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=postgres
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=password
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_EXTERNALSECURE=false
      - ZITADEL_EXTERNALPORT=8080
      - ZITADEL_EXTERNALDOMAIN=localhost
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    networks:
      - nudge-network

volumes:
  nudge_postgres_data:
    name: nudge_postgres_data
  nudge_seq_store:
    name: nudge_seq_store

networks:
  nudge-network:
    name: nudge-network
    driver: bridge

